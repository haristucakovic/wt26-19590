<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Bodovanje po predmetima</title>
    <link rel="stylesheet" href="stil.css">
</head>
<body>
    <table>
        <caption>Bodovanje po predmetima</caption>
        <thead>
            <tr>
                <th></th>
                <th>Ispiti</th>
                <th>Zadaće</th>
                <th>Prisustvo</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="predmet">PNWT</td>
                <td>20</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td class="predmet">MMS</td>
                <td>20</td>
                <td colspan="2">30</td>
            </tr>
            <tr>
                <td class="predmet" rowspan="2">SI</td>
                <td>20/2</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>20</td>
                <td colspan="2">?</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
